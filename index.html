```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chess Super Brain</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://raw.githubusercontent.com/nmrugg/stockfish.js/master/examples/loadEngine.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 5px;
}

#status {
    margin: 10px;
    color: #facc15;
}

#board {
    width: min(90vw, 560px);
    aspect-ratio: 1 / 1;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 4px solid #374151;
}

.square {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(25px, 8vw, 55px);
    cursor: pointer;
    user-select: none;
}

.light {
    background: #f0d9b5;
}

.dark {
    background: #b58863;
}

.selected {
    outline: 4px solid yellow;
    outline-offset: -4px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>♟ Chess Super Brain</h1>

<div id="status">Loading Stockfish...</div>

<div id="board"></div>

<button onclick="newGame()">New Game</button>

<script>

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");

const game = new Chess();

let selectedSquare = null;
let engine = null;
let engineReady = false;
let thinking = false;

const pieces = {
    w: {
        k: "♔",
        q: "♕",
        r: "♖",
        b: "♗",
        n: "♘",
        p: "♙"
    },
    b: {
        k: "♚",
        q: "♛",
        r: "♜",
        b: "♝",
        n: "♞",
        p: "♟"
    }
};

function drawBoard() {

    boardElement.innerHTML = "";

    const board = game.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square = document.createElement("div");

            square.className =
                "square " +
                (((row + col) % 2 === 0) ? "light" : "dark");

            const file = String.fromCharCode(97 + col);
            const rank = 8 - row;
            const squareName = file + rank;

            square.dataset.square = squareName;

            const piece = board[row][col];

            if (piece) {
                square.textContent =
                    pieces[piece.color][piece.type];
            }

            if (selectedSquare === squareName) {
                square.classList.add("selected");
            }

            square.onclick = function() {
                squareClicked(squareName);
            };

            boardElement.appendChild(square);
        }
    }
}

function squareClicked(square) {

    if (thinking) return;

    if (game.turn() !== "w") return;

    if (!selectedSquare) {

        const piece = game.get(square);

        if (piece && piece.color === "w") {

            selectedSquare = square;
            drawBoard();
        }

        return;
    }

    const move = game.move({
        from: selectedSquare,
        to: square,
        promotion: "q"
    });

    if (move) {

        selectedSquare = null;

        drawBoard();

        if (game.game_over()) {

            statusElement.textContent = "Game Over";
            return;
        }

        computerMove();

    } else {

        const piece = game.get(square);

        if (piece && piece.color === "w") {
            selectedSquare = square;
        } else {
            selectedSquare = null;
        }

        drawBoard();
    }
}

function startEngine() {

    try {

        statusElement.textContent =
            "Loading Stockfish...";

        engine = loadEngine(
            "./stockfish-18-lite-single.js#./stockfish-18-lite-single.wasm",
            {},
            function() {

                engineReady = true;

                statusElement.textContent =
                    "Stockfish Ready — Your move";

                engine.send("uci");
                engine.send("isready");
            }
        );

        engine.stream = function(line) {

            console.log("Stockfish:", line);

            if (line === "readyok") {

                engineReady = true;

                statusElement.textContent =
                    "Stockfish Ready — Your move";
            }

            if (line.indexOf("bestmove") === 0) {

                const parts = line.split(" ");

                const bestMove = parts[1];

                if (!bestMove ||
                    bestMove.length < 4) {

                    thinking = false;
                    return;
                }

                game.move({
                    from: bestMove.substring(0, 2),
                    to: bestMove.substring(2, 4),
                    promotion:
                        bestMove.length > 4
                        ? bestMove.substring(4, 5)
                        : "q"
                });

                thinking = false;

                drawBoard();

                if (game.game_over()) {

                    statusElement.textContent =
                        "Game Over";

                } else {

                    statusElement.textContent =
                        "Stockfish Ready — Your move";
                }
            }
        };

    } catch (error) {

        console.error(error);

        statusElement.textContent =
            "Stockfish failed to start";
    }
}

function computerMove() {

    if (!engineReady) {

        statusElement.textContent =
            "Stockfish is still loading...";

        return;
    }

    thinking = true;

    statusElement.textContent =
        "Stockfish is thinking...";

    engine.send(
        "position fen " + game.fen()
    );

    engine.send(
        "go depth 18"
    );
}

function newGame() {

    game.reset();

    selectedSquare = null;
    thinking = false;

    drawBoard();

    if (engineReady) {

        statusElement.textContent =
            "Stockfish Ready — Your move";

    } else {

        statusElement.textContent =
            "Loading Stockfish...";
    }
}

drawBoard();

startEngine();

</script>

</body>
</html>
