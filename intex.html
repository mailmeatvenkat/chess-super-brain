<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Super Brain</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#10141c;
  color:white;
}

header{
  text-align:center;
  padding:18px;
  background:#171d28;
}

h1{
  margin:0;
  font-size:30px;
}

.subtitle{
  color:#aeb8c8;
  margin-top:6px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  justify-content:center;
}

.left{
  width:520px;
  max-width:95vw;
}

.right{
  width:350px;
  max-width:95vw;
}

#board{
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border:4px solid #333;
}

.square{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(28px,6vw,55px);
  cursor:pointer;
  user-select:none;
}

.light{background:#f0d9b5}
.dark{background:#b58863}

.selected{
  box-shadow:inset 0 0 0 5px #ffd43b;
}

.panel{
  background:#171d28;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #303744;
}

button,select{
  width:100%;
  padding:11px;
  margin-top:8px;
  border:0;
  border-radius:7px;
  font-size:15px;
  cursor:pointer;
}

button{
  background:#3b82f6;
  color:white;
}

button:hover{
  background:#2563eb;
}

#status{
  color:#6ee7b7;
  font-weight:bold;
}

#moves{
  max-height:220px;
  overflow:auto;
  line-height:1.8;
  color:#d7deea;
}

.eval{
  font-size:24px;
  font-weight:bold;
}

.small{
  color:#9ca8ba;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>♟ Chess Super Brain</h1>
  <div class="subtitle">Human vs Stockfish</div>
</header>

<div class="container">

<div class="left">
  <div id="board"></div>
</div>

<div class="right">

  <div class="panel">
    <div class="stat">
      <span>Engine</span>
      <span id="status">Loading...</span>
    </div>

    <div class="stat">
      <span>Evaluation</span>
      <span class="eval" id="evaluation">0.00</span>
    </div>

    <div class="stat">
      <span>Depth</span>
      <span id="depth">-</span>
    </div>

    <div class="stat">
      <span>Best Move</span>
      <span id="bestmove">-</span>
    </div>
  </div>

  <div class="panel">
    <label>Thinking Time</label>

    <select id="thinkTime">
      <option value="1000">1 second</option>
      <option value="3000">3 seconds</option>
      <option value="5000" selected>5 seconds</option>
      <option value="10000">10 seconds</option>
      <option value="30000">30 seconds</option>
    </select>

    <button onclick="newGame()">New Game</button>
  </div>

  <div class="panel">
    <b>Moves</b>
    <div id="moves"></div>
  </div>

</div>
</div>

<script>

const game = new Chess();

let engine = null;
let selectedSquare = null;
let engineReady = false;
let thinking = false;

const pieces = {
  wK:"♔", wQ:"♕", wR:"♖", wB:"♗", wN:"♘", wP:"♙",
  bK:"♚", bQ:"♛", bR:"♜", bB:"♝", bN:"♞", bP:"♟"
};


/* =========================
   STOCKFISH ENGINE
   ========================= */

function startEngine(){

  document.getElementById("status").textContent="Loading...";

  engine = new Worker("./stockfish/stockfish-18-lite-single.js");

  engine.onmessage = function(event){

    const line = event.data;

    if(typeof line !== "string") return;

    if(line === "uciok"){
      engine.postMessage("isready");
      return;
    }

    if(line === "readyok"){
      engineReady = true;
      document.getElementById("status").textContent="Ready";
      analyzePosition();
      return;
    }

    if(line.startsWith("info")){

      const depthMatch = line.match(/depth (\d+)/);
      const scoreMatch = line.match(/score (cp|mate) (-?\d+)/);

      if(depthMatch){
        document.getElementById("depth").textContent =
          depthMatch[1];
      }

      if(scoreMatch){

        let value;

        if(scoreMatch[1] === "mate"){
          value = "M" + scoreMatch[2];
        }else{
          value = (parseInt(scoreMatch[2])/100).toFixed(2);
        }

        document.getElementById("evaluation").textContent=value;
      }
    }

    if(line.startsWith("bestmove")){

      const parts = line.split(" ");
      const move = parts[1];

      if(thinking && move && move !== "(none)"){

        const result = game.move({
          from:move.substring(0,2),
          to:move.substring(2,4),
          promotion:"q"
        });

        if(result){
          thinking=false;
          renderBoard();
          updateMoves();
          document.getElementById("status").textContent="Your turn";
          analyzePosition();
        }
      }
    }
  };

  engine.onerror = function(){
    document.getElementById("status").textContent="Engine error";
    console.error("Stockfish could not start.");
  };

  engine.postMessage("uci");
}


/* =========================
   BOARD
   ========================= */

function renderBoard(){

  const board=document.getElementById("board");
  board.innerHTML="";

  const position=game.board();

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const square=document.createElement("div");

      square.className="square " +
        ((r+c)%2===0 ? "light":"dark");

      const file=String.fromCharCode(97+c);
      const rank=8-r;
      const squareName=file+rank;

      square.dataset.square=squareName;

      const piece=position[r][c];

      if(piece){
        square.textContent =
          pieces[piece.color+piece.type.toUpperCase()];
      }

      if(selectedSquare===squareName){
        square.classList.add("selected");
      }

      square.onclick=()=>handleSquare(squareName);

      board.appendChild(square);
    }
  }
}


/* =========================
   HUMAN MOVE
   ========================= */

function handleSquare(square){

  if(thinking) return;

  if(game.game_over()) return;

  if(game.turn()!=="w") return;

  if(!selectedSquare){

    const piece=game.get(square);

    if(piece && piece.color==="w"){
      selectedSquare=square;
      renderBoard();
    }

    return;
  }

  const move=game.move({
    from:selectedSquare,
    to:square,
    promotion:"q"
  });

  if(move){

    selectedSquare=null;

    renderBoard();
    updateMoves();

    if(game.game_over()){
      document.getElementById("status").textContent="Game Over";
      return;
    }

    thinking=true;
    document.getElementById("status").textContent="Thinking...";

    calculateComputerMove();

  }else{

    const piece=game.get(square);

    if(piece && piece.color==="w"){
      selectedSquare=square;
    }else{
      selectedSquare=null;
    }

    renderBoard();
  }
}


/* =========================
   COMPUTER MOVE
   ========================= */

function calculateComputerMove(){

  if(!engineReady) return;

  const time=parseInt(
    document.getElementById("thinkTime").value
  );

  engine.postMessage("ucinewgame");
  engine.postMessage("position fen " + game.fen());
  engine.postMessage("go movetime " + time);
}


/* =========================
   EVALUATION
   ========================= */

function analyzePosition(){

  if(!engineReady || game.game_over()) return;

  engine.postMessage("stop");
  engine.postMessage("position fen " + game.fen());
  engine.postMessage("go movetime 500");
}


/* =========================
   MOVE LIST
   ========================= */

function updateMoves(){

  const history=game.history();

  let html="";

  for(let i=0;i<history.length;i+=2){

    html += "<div>";

    html += Math.floor(i/2)+1 + ". ";

    html += history[i] || "";

    if(history[i+1]){
      html += " " + history[i+1];
    }

    html += "</div>";
  }

  document.getElementById("moves").innerHTML=html;
}


/* =========================
   NEW GAME
   ========================= */

function newGame(){

  game.reset();

  selectedSquare=null;
  thinking=false;

  document.getElementById("evaluation").textContent="0.00";
  document.getElementById("depth").textContent="-";
  document.getElementById("bestmove").textContent="-";
  document.getElementById("moves").innerHTML="";

  renderBoard();

  if(engineReady){
    engine.postMessage("ucinewgame");
    engine.postMessage("isready");
  }
}


/* =========================
   START
   ========================= */

renderBoard();
updateMoves();
startEngine();

</script>

</body>
</html>
